schema: spec-driven

context: |
  Component: Web frontend for the requirement review backend.
  Stack: TypeScript, React 18, React Router, Vite, Vitest, jsdom.
  The repository-root openspec/specs directory owns all public contracts (HTTP API
  schemas, authorization, project isolation, error responses). Frontend specs cover
  UI flows, session context, client-side authorization gating, error surfacing, and
  frontend build/tooling. Never duplicate or weaken a root public contract;
  reference it by path instead (for example openspec/specs/public-contracts/spec.md).
  Use TypeScript with strict mode, mirror backend Pydantic field names, and follow
  Conventional Commits.

rules:
  proposal:
    - Identify every root public contract consumed.
    - State accessibility and progressive-enhancement impact when relevant.
    - Include a Non-goals section.
  specs:
    - Include success, failure, authorization, and session scenarios when applicable.
  tasks:
    - List exact lint, typecheck, and test commands.
