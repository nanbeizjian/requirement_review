[project]
name = "requirement-review"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi", "uvicorn[standard]", "pydantic-settings", "python-multipart",
  "langgraph", "langchain-core", "langchain-openai",
  "sqlalchemy[asyncio]", "asyncpg", "alembic", "pgvector", "boto3",
  "opentelemetry-api", "opentelemetry-sdk", "structlog",
  "httpx>=0.27",
  "langsmith>=0.1",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]
